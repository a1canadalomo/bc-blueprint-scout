<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  .nsc-root {
    --navy: #0d2647;
    --navy-deep: #081a34;
    --grid: rgba(255,255,255,0.06);
    --white: #ffffff;
    --dim: rgba(255,255,255,0.62);
    --dimmer: rgba(255,255,255,0.38);
    --accent: #ffffff;
    font-family: 'Inter', -apple-system, sans-serif;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 54px 54px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 54px 54px,
      var(--navy);
    color: var(--white);
    border-radius: 12px;
    padding: 0;
    max-width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }
  .nsc-root * { box-sizing: border-box; }

  .nsc-header {
    padding: 28px 30px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
  }
  .nsc-kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--dim);
    margin: 0 0 8px;
  }
  .nsc-title {
    font-size: 26px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .nsc-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dimmer);
    margin-top: 6px;
  }
  .nsc-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .nsc-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    background: transparent;
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.35);
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  .nsc-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.6); }
  .nsc-btn:disabled { opacity: 0.45; cursor: default; }
  .nsc-btn.primary { background: var(--white); color: var(--navy-deep); border-color: var(--white); font-weight: 600; }
  .nsc-btn.primary:hover { background: rgba(255,255,255,0.88); }

  .nsc-body { padding: 22px 30px 30px; }

  .nsc-status { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dimmer); padding: 30px 0; text-align: center; }

  .nsc-grid { display: flex; flex-direction: column; gap: 1px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
  .nsc-item {
    background: var(--navy);
    padding: 16px 18px;
    display: flex;
    gap: 16px;
    align-items: baseline;
    text-decoration: none;
    color: inherit;
    transition: background 0.12s ease;
  }
  .nsc-item:hover { background: rgba(255,255,255,0.05); }
  .nsc-item-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--navy-deep);
    background: rgba(255,255,255,0.85);
    padding: 3px 7px;
    border-radius: 4px;
    flex-shrink: 0;
    white-space: nowrap;
    font-weight: 600;
  }
  .nsc-item-main { flex: 1; min-width: 0; }
  .nsc-item-title { font-size: 14.5px; font-weight: 500; line-height: 1.4; }
  .nsc-item-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dimmer);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .nsc-footer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dimmer);
    padding-top: 18px;
    text-align: center;
  }

  @media (max-width: 560px) {
    .nsc-header, .nsc-body { padding-left: 18px; padding-right: 18px; }
    .nsc-item { flex-wrap: wrap; }
    .nsc-item-date { order: 3; }
  }
</style>

<div class="nsc-root">
  <div class="nsc-header">
    <div>
      <p class="nsc-kicker">BC BLUEPRINT — NEWS SCOUT</p>
      <h1 class="nsc-title">Today's BC housing scan</h1>
      <p class="nsc-sub" id="nsc-updated">Not scanned yet</p>
    </div>
    <div class="nsc-actions">
      <button class="nsc-btn" id="nsc-refresh">Rescan sources</button>
      <button class="nsc-btn primary" id="nsc-copy-btn">Copy all headlines</button>
    </div>
  </div>
  <div class="nsc-body">
    <div id="nsc-list"><div class="nsc-status">Scanning STOREYS, Better Dwelling, CBC BC, BIV, and City of Vancouver…</div></div>
    <div class="nsc-footer" id="nsc-count"></div>
  </div>
</div>

<script>
(function() {
  const FEEDS = [
    { tag: 'STOREYS', url: 'https://storeys.com/feeds/feed.rss', alwaysShow: true },
    { tag: 'BETTER DWELLING', url: 'https://betterdwelling.com/feed/', alwaysShow: true },
    { tag: 'CBC BC', url: 'https://www.cbc.ca/webfeed/rss/rss-canada-britishcolumbia', alwaysShow: false },
    { tag: 'BIV', url: 'https://biv.com/rss', alwaysShow: false },
    { tag: 'CITY OF VANCOUVER', url: 'https://vancouver.ca/news-calendar/vancouver-news.rss', alwaysShow: false }
  ];

  const HOUSING_KEYWORDS = [
    'housing','real estate','rent','renter','tenant','condo','presale','pre-sale',
    'developer','development','rezon','zoning','mortgage','property','construction',
    'homeowner','affordab','strata','landlord','apartment','townhouse','build',
    'interest rate','bank of canada','cmhc','vacancy'
  ];

  let allItems = [];

  function isHousingRelevant(item) {
    const text = (item.title + ' ' + (item.description || '')).toLowerCase();
    return HOUSING_KEYWORDS.some(k => text.includes(k));
  }

  function relTime(dateStr) {
    const d = new Date(dateStr);
    if (isNaN(d)) return '';
    const diffMs = Date.now() - d.getTime();
    const hrs = Math.floor(diffMs / 3600000);
    if (hrs < 1) return 'just now';
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 7) return days + 'd ago';
    return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
  }

  function stripHtml(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return (tmp.textContent || '').trim();
  }

  async function fetchFeed(feed) {
    const proxyUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url);
    try {
      const res = await fetch(proxyUrl);
      const data = await res.json();
      if (data.status !== 'ok') throw new Error('bad status');
      return data.items.map(it => ({
        title: it.title,
        link: it.link,
        pubDate: it.pubDate,
        description: stripHtml(it.description).slice(0, 220),
        tag: feed.tag,
        alwaysShow: feed.alwaysShow
      }));
    } catch (e) {
      console.error('Feed failed:', feed.tag, e);
      return [];
    }
  }

  async function loadAll() {
    const listEl = document.getElementById('nsc-list');
    const updatedEl = document.getElementById('nsc-updated');
    listEl.innerHTML = '<div class="nsc-status">Scanning STOREYS, Better Dwelling, CBC BC, BIV, and City of Vancouver…</div>';

    const results = await Promise.all(FEEDS.map(fetchFeed));
    let items = results.flat();

    items = items.filter(it => it.alwaysShow || isHousingRelevant(it));

    const seen = new Set();
    items = items.filter(it => {
      const key = it.title.toLowerCase().trim();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    items = items.slice(0, 30);
    allItems = items;

    updatedEl.textContent = items.length
      ? 'Last scanned ' + new Date().toLocaleString('en-CA', { hour: 'numeric', minute: '2-digit', month: 'short', day: 'numeric' })
      : 'Scan failed — try again';

    if (!items.length) {
      listEl.innerHTML = '<div class="nsc-status">Couldn\'t reach any sources right now. Hit "Rescan sources" to retry.</div>';
      document.getElementById('nsc-count').textContent = '';
      return;
    }

    listEl.innerHTML = '<div class="nsc-grid">' + items.map(it => `
      <a class="nsc-item" href="${it.link}" target="_blank" rel="noopener">
        <span class="nsc-item-tag">${it.tag}</span>
        <span class="nsc-item-main">
          <div class="nsc-item-title">${it.title}</div>
        </span>
        <span class="nsc-item-date">${relTime(it.pubDate)}</span>
      </a>
    `).join('') + '</div>';

    document.getElementById('nsc-count').textContent = items.length + ' stories from 5 sources · click any headline to read';
  }

  function copyHeadlines() {
    const btn = document.getElementById('nsc-copy-btn');
    if (!allItems.length) return;

    const text = allItems.map((it, i) =>
      `${i + 1}. [${it.tag}] ${it.title}\n${it.link}`
    ).join('\n\n');

    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(() => { btn.textContent = original; }, 1800);
    }).catch(() => {
      alert('Copy failed — select and copy manually:\n\n' + text);
    });
  }

  document.getElementById('nsc-refresh').addEventListener('click', loadAll);
  document.getElementById('nsc-copy-btn').addEventListener('click', copyHeadlines);

  loadAll();
})();
</script>
